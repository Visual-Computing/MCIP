data: 
  image_paths: /path/to/image_paths_file.npy
  image_categories: /path/to/image_categories_file.npy
  eval_base_path: /path/to/evaluation_base_folder/
model: MobileViT
loss: ArcFace
train_batch_size: 256
test_batch_size: 512
base_lr: 1.0e-05
